# Harness evals — skills, subagents and the workflow tier, run on OpenRouter.
#
# What runs is decided per PR by evals/scripts/ci-detect.mjs from the changed files:
#   .claude/skills/<n>/**  → evals/skills/<n>          (content tier, DeepSeek, no proxy)
#   .claude/agents/<n>.md  → evals/agents/<n>          (tool tier, Gemini Flash via LiteLLM proxy)
#   CLAUDE.md / any agent / evals/{workflow,src}       → workflow tier (Gemini Flash, non-blocking)
# An artifact with NO written evals is not a failure: it is listed as "SKIP <name> (no evals)".
#
# Model switch (no UI): workflow_dispatch inputs, or repo Variables
# (Settings → Secrets and variables → Actions → Variables): EVAL_SKILLS_MODEL,
# EVAL_TOOLS_MODEL, EVAL_JUDGE_MODEL. Priority: dispatch input > variable > default below.
#
# Needs the repo secret OPENROUTER_API_KEY. PRs from forks have no secrets → the eval jobs
# are skipped with a notice instead of failing.
name: evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'CLAUDE.md'
      - '.claude/CLAUDE.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      skills_model:
        description: 'Model for skill evals (OpenRouter slug)'
        default: ''
      tools_model:
        description: 'Model for agent + workflow evals (OpenRouter slug; must support tool use)'
        default: ''
      judge_model:
        description: 'LLM-judge model (OpenRouter slug)'
        default: ''
      run_all:
        description: 'Run every skill/agent/workflow eval, ignoring changed files'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: key
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY is not available (fork PR?) — evals skipped"
          fi

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          RUN_ALL_INPUT: ${{ inputs.run_all }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          else
            CHANGED_FILES=""
          fi
          export CHANGED_FILES
          if [ "$RUN_ALL_INPUT" = "true" ]; then
            export EVAL_RUN_ALL=1
          fi
          node evals/scripts/ci-detect.mjs

      - name: Report skipped artifacts (no evals written)
        env:
          SKIPPED_SKILLS: ${{ steps.detect.outputs.skipped_skills }}
          SKIPPED_AGENTS: ${{ steps.detect.outputs.skipped_agents }}
        run: |
          [ -n "$SKIPPED_SKILLS" ] && echo "::notice::SKIP skills (no evals): $SKIPPED_SKILLS" || true
          [ -n "$SKIPPED_AGENTS" ] && echo "::notice::SKIP agents (no evals): $SKIPPED_AGENTS" || true

  skills:
    name: skill:${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.has_key == 'true' && needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        name: ${{ fromJson(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.skills_model || vars.EVAL_SKILLS_MODEL || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run skills/${{ matrix.name }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-skill-${{ matrix.name }}
          path: evals/results/
          if-no-files-found: ignore

  agents:
    name: agent:${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.has_key == 'true' && needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        name: ${{ fromJson(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.tools_model || vars.EVAL_TOOLS_MODEL || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'google/gemini-2.5-flash' }}
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run agents/${{ matrix.name }}
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-agent-${{ matrix.name }}
          path: evals/results/
          if-no-files-found: ignore

  workflow:
    name: workflow
    needs: detect
    if: needs.detect.outputs.has_key == 'true' && needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking for now: activation cases are behaviour-shaped and flaky on non-Anthropic
    # models (evals/README.md). Flip to false once a few runs are stable.
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.tools_model || vars.EVAL_TOOLS_MODEL || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'google/gemini-2.5-flash' }}
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-workflow
          path: evals/results/
          if-no-files-found: ignore
